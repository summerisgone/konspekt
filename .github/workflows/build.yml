name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: scripts/build-app.sh
      - run: ditto -c -k --keepParent .build/Konspekt.app Konspekt.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Konspekt
          path: Konspekt.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" Konspekt.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@v0.5.0
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - run: swift test
      - run: scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Konspekt-windows
          path: .build/Konspekt-windows.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$env:GITHUB_REF_NAME" .build/Konspekt-windows.zip
        env:
          GH_TOKEN: ${{ github.token }}
