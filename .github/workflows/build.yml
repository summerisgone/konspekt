name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: scripts/build-app.sh
        env:
          KONSPEKT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - run: ditto -c -k --keepParent .build/Konspekt.app Konspekt.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Konspekt
          path: Konspekt.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@v0.5.0
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - run: swift test
      - run: scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Konspekt-windows
          path: .build/Konspekt-windows.zip

  # Releases are immutable: assets can't be added after publishing, so create it once with both zips.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # Tags with a suffix (v0.5.0-beta.1) are test builds: pre-release, not "Latest".
      - run: >-
          gh release create "$GITHUB_REF_NAME" Konspekt.zip Konspekt-windows.zip --repo "$GITHUB_REPOSITORY" --generate-notes
          $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
